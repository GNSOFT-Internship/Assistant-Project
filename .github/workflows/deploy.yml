name: Deploy to Production

# main에 push되면 백엔드/프론트엔드 테스트를 다시 한 번 CI에서 통과시킨 뒤에만
# 서버에 SSH로 접속해 deploy.sh를 실행한다. 로컬 pre-push 훅이 이미 테스트를
# 강제하고 있지만, --no-verify로 우회되거나 훅이 설치되지 않은 다른 환경에서
# push된 경우까지 대비해 배포 직전에 한 번 더 독립적으로 검증한다.
on:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend-py/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

  deploy:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + 변경분 재시작/재빌드 + 배포 후 검증)
        env:
          # GitHub Secrets 입력창에 PEM 키를 그대로 붙여넣으면 줄바꿈이 깨져서
          # ssh가 키 형식을 못 읽는 경우가 있었다. base64로 한 줄 문자열로 인코딩해
          # 저장하고 여기서 다시 디코딩하면 줄바꿈 손상 문제가 원천적으로 없다.
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key rocky@217.142.238.104 \
            "sudo bash /root/Assistant-Project/deploy.sh"
